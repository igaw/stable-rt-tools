name: Python application

on:
  push:
    branches: [ master, devel ]
  pull_request:
    branches: [ master, devel ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e .[lint]
      - name: Lint with ruff
        run: ruff check --output-format=github .
      - name: Type check with mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git git-email gnupg quilt patch xz-utils
      - name: Install
        run: python -m pip install -e .[test]
      - name: Test with pytest
        run: pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Check the wheel ships the templates
        run: |
          for t in announce-srt.txt announce-srt-rc.txt commit-tmpl.txt py.typed; do
            python -m zipfile -l dist/*.whl | grep -q "stable_rt_tools/$t"
          done
